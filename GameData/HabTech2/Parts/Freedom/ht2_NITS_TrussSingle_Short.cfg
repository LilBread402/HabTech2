PART
{
	name = ht2_NITS_TrussSingle_Short
	module = Part
	author = Lil_Bread_402
	rescaleFactor = 1

	TechRequired = generalConstruction
	entryCost = 1200
	cost = 650
	category = Structural
	subcategory = 0
	title = ST-ITS-1985 "Baseline" External Truss System
	manufacturer = HabTech Consortium and the Marc Reserve
	description = External Non Integrated Truss System (NITS) utilizing the new QuickTatch mounting system.
	attachRules = 1,1,1,1,1
	mass = .3
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 1
	crashTolerance = 50
	maxTemp = 2700 // = 3000
	emissiveConstant = 0.87
	fuelCrossFeed = True
	bulkheadProfiles = mk3
	breakingForce = 300
	breakingTorque = 300
	tags = Space Station Freedom Truss

// model and node

	MODEL
	{
		model = HabTech2/Parts/Freedom/ht2_NITS_TrussSingle_Short
		rotation = -90, 0, 0	// X Y Z
	}
	

// bare nodes

	NODE
	{
		name = TopNode
		transform = Short_Stick_Node_Top
		size = 1
	}
	NODE
	{
		name = BottomNode
		transform = Short_Stick_Node_Bottom
		size = 1
	}
	
// ball nodes
	
	NODE
	{
		name = BallNode1
		transform = BallJoint_Node1
		size = 1
	}
	NODE
	{
		name = BallNode2
		transform = BallJoint_Node2
		size = 1
	}
	NODE
	{
		name = BallNode3
		transform = BallJoint_Node3
		size = 1
	}
	NODE
	{
		name = BallNode4
		transform = BallJoint_Node4
		size = 1
	}
	NODE
	{
		name = BallNode5
		transform = BallJoint_Node5
		size = 1
	}

	
// ksp part inventory stuff

	MODULE:NEEDS[Squad/Parts/Cargo/ScienceKit]
	{
		name = ModuleCargoPart
		packedVolume = 0.8
	}

// partswitch

    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = Ball Joint
        switcherDescription = Top Design
        switcherDescriptionPlural = Top
		switchInFlight = true
        SUBTYPE
        {
            name = Ball Joint
            title = Ball Joint
			transform = Short_Stick_Ball
			addedMass = .02
			addedCost = 1
			node = BallNode1
			node = BallNode2
			node = BallNode3
			node = BallNode4
			node = BallNode5
        }
        SUBTYPE
        {
            name = No Ball Joint
            title = Bare End
			node = TopNode
        }		
	}
}