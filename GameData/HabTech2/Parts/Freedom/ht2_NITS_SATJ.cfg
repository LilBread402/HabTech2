PART
{
	name = ht2_NITS_SATJ // Solar Array Rotary Joint
	module = Part
	author = Lil_Bread402

	rescaleFactor = 1
	TechRequired = advConstruction
	entryCost = 1000
	cost = 60
	category = Robotics
	subcategory = 0
	title = ST-ITS-1999 Solar Array Rotary Joint
	manufacturer = HabTech Consortium
	description = Small sized adapter for the Non Integrated Truss System (NITS). Designed to rotate and solar arrays attached. 


	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,0,1,0,0
	mass = 0.016
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 12
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 2000 // = 5000
	bulkheadProfiles = size1
	tags = habtech, robot, arm, canadarm, kerboarm, rotate, hinge, servo, motor, move, 

	MODEL
	{
		model = HabTech2/Parts/Freedom/ht2_NITS_SATJ
		rotation = -90, 0, 0	// X Y Z
	}

	NODE
	{
		name = TopJoint
		transform = ARJTopNode
		size = 1
		method= FIXED_JOINT
		rigid = true
	}
	NODE
	{
		name = BottomJoint
		transform = ARJBottomNode
		size = 1
		method= FIXED_JOINT
		rigid = true
	}

	MODULE
	{
		name = ModuleRoboticRotationServo
		servoTransformName = ARJ_Rotate
		baseTransformName = ARJ_Main
		servoAttachNodes = TopJoint
		traverseVelocityLimits = 0, 10
		hardMinMaxLimits = -180, 180
		softMinMaxAngles = -180, 180
		targetAngle = 0
		mainAxis = Z
		maxMotorOutput = 200
		driveSpringMutliplier = 100
		driveDampingMutliplier = 20
		motorizedMassPerKN = 0.0001
		motorizedCostPerDriveUnit = 1
		connectedMassScale = 1
		efficiency = 0.75
		baseResourceConsumptionRate = 0.01
		RESOURCE
		{
			name = ElectricCharge
			rate = 1
		}
	}

	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 5
		stackableQuantity = 5
	}
}
